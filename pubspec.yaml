name: nopepads_mobile
description: "A new Flutter version of MyNotes/NOPEPADS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Database & Auth
  supabase_flutter: ^2.5.4
  
  # Local Database (Offline Support)
  sqflite: ^2.3.3+2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  
  # Network Connectivity
  connectivity_plus: ^6.0.3
  
  # UI & Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  
  # Rich Text Editor
  flutter_quill: ^11.5.1
  
  # Desktop Multi-Window
  desktop_multi_window: ^0.3.1
  window_manager: ^0.5.2

  # Storage
  shared_preferences: ^2.2.3
  
  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.3
  go_router: ^14.0.1
  flutter_dotenv: ^5.1.0
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - .env
